name: Setup Tools
description: Setup required tools in the workspace

runs:
  using: composite
  steps:
  - name: Setup Tools
    uses: egose/actions/asdf-tools@b5084ae08d5d42dda515204f5df7b1e7f464b74e
    with:
      github-token: ${{ github.token }}
      plugins: |
        docker-compose=https://github.com/egose/asdf-docker-compose.git

  - name: Install python tools
    run: |
      pip install --require-hashes -r requirements.txt
      asdf reshim
    shell: bash

name: Setup NPM Packages
description: Setup required NPM packages with caching for pnpm
runs:
  using: composite
  steps:
  - name: Setup Tools
    uses: egose/actions/pnpm-packages@b5084ae08d5d42dda515204f5df7b1e7f464b74e
    with:
      frozen: 'true'
      ignore-scripts: 'true'
      paths: |
        .
        website

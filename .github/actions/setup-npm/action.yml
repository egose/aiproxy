name: Setup NPM Packages
description: Setup required NPM packages with caching for pnpm
runs:
  using: composite
  steps:
  - name: Setup Tools
    uses: egose/actions/pnpm-packages@6e49f5129448cff1d901b16032c09445bd49dde1
    with:
      frozen: 'true'
      ignore-scripts: 'true'
      paths: |
        .
        website

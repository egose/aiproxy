name: Test

on:
  workflow_call:
  pull_request:
    paths-ignore:
    - '**.md'
  push:
    paths-ignore:
    - '**.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vet-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - name: validate toolchain declarations
      run: make check-toolchain

    - name: Setup Tools (asdf)
      uses: ./.github/actions/setup-tools

    - name: go vet
      run: make vet

    - name: go build (host)
      run: make build

    - name: go build (all targets)
      run: make build-all

    - name: validate build atomicity
      run: make validate-build-atomicity

    - name: validate release archives
      run: |
        make build-archive
        make validate-archives

    - name: validate reproducible archives
      run: make check-reproducible-archives

    - name: validate shell and workflows
      run: make lint-shell lint-workflows shell-test

  unit-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - name: Setup Tools (asdf)
      uses: ./.github/actions/setup-tools

    - name: go test ./...
      run: make test

    - name: go test -race ./...
      run: make test-race

  integration-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - name: Setup Tools (asdf)
      uses: ./.github/actions/setup-tools

    - name: hermetic binary integration tests
      run: make integration

  # Real-provider sandbox tests remain intentionally separate from normal CI.

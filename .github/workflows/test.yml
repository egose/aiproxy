name: Test

on:
  workflow_call:
  pull_request:
    paths-ignore:
    - '**.md'
  push:
    paths-ignore:
    - '**.md'

jobs:
  vet-build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: validate toolchain declarations
      run: make check-toolchain

    - name: Setup Tools (asdf)
      uses: ./.github/actions/setup-tools

    - name: go vet
      run: make vet

    - name: go build (host)
      run: make build

    - name: go build (all targets)
      run: make build-all

    - name: validate build atomicity
      run: make validate-build-atomicity

    - name: validate release archives
      run: |
        make build-archive
        make validate-archives

  unit-test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools (asdf)
      uses: ./.github/actions/setup-tools

    - name: go test ./...
      run: make test

    - name: go test -race ./...
      run: make test-race

  integration-test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools (asdf)
      uses: ./.github/actions/setup-tools

    - name: hermetic binary integration tests
      run: make integration

  # Real-provider sandbox tests remain intentionally separate from normal CI.

name: Publish Docker image

on:
  push:
    tags:
    - v*.*.*

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: egose/aiproxy

jobs:
  quality:
    uses: ./.github/workflows/test.yml

  build-push:
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
      security-events: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Normalize version
      id: version
      run: |
        set -euo pipefail
        version="${GITHUB_REF_NAME#v}"
        if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then
          echo "unexpected release tag $GITHUB_REF_NAME" >&2
          exit 1
        fi
        major="${version%%.*}"
        rest="${version#*.}"
        minor="${rest%%.*}"
        image="${DOCKER_REGISTRY}/${IMAGE_NAME}"
        {
          echo "version=$version"
          echo "image=$image"
          echo "verify_tag=aiproxy:release-verify-$GITHUB_SHA"
          echo "major_tag=$image:$major"
          echo "minor_tag=$image:$major.$minor"
          echo "version_tag=$image:$version"
        } >> "$GITHUB_OUTPUT"

    - name: Build image for verification
      run: |
        set -euo pipefail
        docker build \
          --build-arg VERSION=${{ steps.version.outputs.version }} \
          -t ${{ steps.version.outputs.verify_tag }} \
          -f Dockerfile .

    - name: Verify image version
      run: |
        set -euo pipefail
        actual=$(docker run --rm --entrypoint /usr/local/bin/aiproxy ${{ steps.version.outputs.verify_tag }} version)
        if [ "$actual" != "${{ steps.version.outputs.version }}" ]; then
          echo "image reports version $actual, expected ${{ steps.version.outputs.version }}" >&2
          exit 1
        fi

    - name: Build and push image
      uses: egose/actions/docker-build-push@fbfffcb8803b91ff10096df512564a801173c24f
      with:
        registry-url: ${{ env.DOCKER_REGISTRY }}
        registry-username: ${{ github.actor }}
        registry-password: ${{ secrets.GITHUB_TOKEN }}
        image-name: ${{ env.IMAGE_NAME }}
        metadata-tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
        docker-context: .
        docker-file: Dockerfile
        docker-args: |
          VERSION=${{ steps.version.outputs.version }}

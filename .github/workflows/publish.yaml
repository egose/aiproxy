name: Publish Docker image

on:
  push:
    tags:
    - v*.*.*

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: egose/aiproxy

jobs:
  quality:
    uses: ./.github/workflows/test.yml

  build-push:
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
      security-events: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Normalize version
      id: version
      run: |
        set -euo pipefail
        version="${GITHUB_REF_NAME#v}"
        if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then
          echo "unexpected release tag $GITHUB_REF_NAME" >&2
          exit 1
        fi
        major="${version%%.*}"
        rest="${version#*.}"
        minor="${rest%%.*}"
        image="${DOCKER_REGISTRY}/${IMAGE_NAME}"
        {
          echo "version=$version"
          echo "image=$image"
          echo "major_tag=$image:$major"
          echo "minor_tag=$image:$major.$minor"
          echo "version_tag=$image:$version"
        } >> "$GITHUB_OUTPUT"

    - name: Build image
      run: |
        set -euo pipefail
        docker build \
          --build-arg VERSION=${{ steps.version.outputs.version }} \
          -t ${{ steps.version.outputs.version_tag }} \
          -t ${{ steps.version.outputs.minor_tag }} \
          -t ${{ steps.version.outputs.major_tag }} \
          -f Dockerfile .

    - name: Verify image version
      run: |
        set -euo pipefail
        actual=$(docker run --rm --entrypoint /usr/local/bin/aiproxy ${{ steps.version.outputs.version_tag }} version)
        if [ "$actual" != "${{ steps.version.outputs.version }}" ]; then
          echo "image reports version $actual, expected ${{ steps.version.outputs.version }}" >&2
          exit 1
        fi

    - name: Scan image
      uses: aquasecurity/trivy-action@0.33.1
      with:
        image-ref: ${{ steps.version.outputs.version_tag }}
        format: sarif
        output: trivy-results.sarif
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: '1'

    - name: Upload scan results
      if: always()
      uses: github/codeql-action/upload-sarif@3c3833e0f8c1c83d449a7478aa59c036a9165498
      with:
        sarif_file: trivy-results.sarif

    - name: Login to registry
      run: |
        set -euo pipefail
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$DOCKER_REGISTRY" -u "${{ github.actor }}" --password-stdin

    - name: Push image
      run: |
        set -euo pipefail
        docker push ${{ steps.version.outputs.version_tag }}
        docker push ${{ steps.version.outputs.minor_tag }}
        docker push ${{ steps.version.outputs.major_tag }}

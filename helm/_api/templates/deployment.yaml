{{- $deploymentTag := .Values.image.tag | default .Chart.AppVersion -}}
{{- $global := .Values.global | default dict -}}
{{- $envSecretName := .Values.envSecretName | default "" -}}
{{- $serviceAccountName := .Values.serviceAccountName | default ($global.serviceAccountName | default (include "_.serviceAccountName" .)) -}}
{{- $configSecretName := "" -}}
{{- if or .Values.config.existingSecret .Values.config.content (not (empty .Values.secrets.keysJson)) .Values.secrets.keysJsonRaw }}
{{- $configSecretName = include "_.configSecretName" . }} # pragma: allowlist secret
{{- end }}
{{- $configMountPath := .Values.config.mountPath | default "/etc/aiproxy" -}}
{{- $configKey := .Values.config.configKey | default "config.hcl" -}}
{{- $configFile := printf "%s/%s" ($configMountPath | trimSuffix "/") $configKey -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "_.fullname" . }}
  labels:
    {{- include "_.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "_.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $podAnnotations := merge (.Values.podAnnotations | default dict) ($global.podAnnotations | default dict) -}}
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "_.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- $imagePullSecrets := concat (.Values.imagePullSecrets | default list) ($global.imagePullSecrets | default list) -}}
      {{- with $imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ $serviceAccountName }}
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ $deploymentTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.args }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          {{- else if $configSecretName }}
          args:
            - serve
            - --config
            - {{ $configFile }}
          {{- end }}
          env:
            - name: DEPLOYMENT_TAG
              value: {{ $deploymentTag | quote }}
            - name: HELM_REVISION
              value: {{ .Release.Revision | quote }}
          {{- $env := merge ($global.env | default dict) (.Values.env | default dict) -}}
            {{- range $k, $v := $env }}
            - name: {{ $k | quote }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if not (hasKey $env "XDG_CONFIG_HOME") }}
            - name: XDG_CONFIG_HOME
              value: /tmp/aiproxy-xdg
          {{- end }}
          {{- if $envSecretName }}
          envFrom:
            - secretRef:
                name: {{ $envSecretName }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $configSecretName }}
            - name: aiproxy-config
              mountPath: {{ $configMountPath }}
              readOnly: true
            {{- end }}
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $configSecretName }}
        - name: aiproxy-config
          secret:
            secretName: {{ $configSecretName }}
            defaultMode: 0400
        {{- end }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
